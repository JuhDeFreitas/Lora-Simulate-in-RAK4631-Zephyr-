# Kconfig fragment merged automatically when building for rak4631/nrf52840.

# SEGGER RTT is wired on this board – keep it available for logging/debug.
CONFIG_USE_SEGGER_RTT=y

# nRF52840 hardware features
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y

# Link the image at the offset defined by the DT chosen `zephyr,code-partition`
# (see boards/rak4631_nrf52840.overlay -> 0x1000, right after the MBR) so the
# UF2 bootloader can launch it. Without this the image links at 0x0.
CONFIG_USE_DT_CODE_PARTITION=y


CONFIG_BUILD_OUTPUT_UF2=y

# --- USB console (CDC ACM) -------------------------------------------------
# Exposes the board as a USB serial device (e.g. /dev/ttyACM0) so console,
# logging and shell are usable without an external UART adapter.
# Uses the new USB device stack (USB_DEVICE_STACK is deprecated) with the
# app/ helper that brings up the USB device + CDC ACM UART at boot with no
# extra code needed in main.c.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="RAK4631 Console"
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0x0100
CONFIG_UART_LINE_CTRL=y
