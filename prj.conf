# SPDX-License-Identifier: Apache-2.0
#
# Base configuration shared by every board.
# Board-specific tweaks live in boards/<board>.conf

# --- Logging --------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_ICC_LOG_LEVEL=4

# --- Console / serial ----------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- C library ---------------------------------------------------------
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Kernel / diagnostics --------------------------------------------------
CONFIG_THREAD_NAME=y
CONFIG_REBOOT=y
CONFIG_ASSERT=y

# --- Peripherals -------------------------------------------------------
CONFIG_GPIO=y

# --- Build -------------------------------------------------------
CONFIG_BUILD_OUTPUT_UF2=y

# --- Lo-ra -------------------------------------------
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_US915=y

# HAS_SEMTECH_SOFT_SE (software Secure Element used by loramac-node for
# AES/CMAC key derivation and join handling) requires a system workqueue
# stack of at least 2048 bytes; without it the option is silently dropped
# and SecureElement* symbols are left undefined at link time.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# main() now runs lorawan_init()/lorawan_join() synchronously, which pulls
# in the loramac-node crypto/MAC stack on the caller's thread. The board's
# default MAIN_STACK_SIZE (1024) is tight for that with MPU stack guard
# (HW_STACK_PROTECTION) enabled, so give it more headroom.
CONFIG_MAIN_STACK_SIZE=2048
