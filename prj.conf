# SPDX-License-Identifier: Apache-2.0
#
# Base configuration shared by every board.
# Board-specific tweaks live in boards/<board>.conf

# --- Logging --------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_ICC_LOG_LEVEL=4

# --- Console / serial ----------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- C library ---------------------------------------------------------
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Kernel / diagnostics --------------------------------------------------
CONFIG_THREAD_NAME=y
CONFIG_REBOOT=y
CONFIG_ASSERT=y

# --- Peripherals -------------------------------------------------------
CONFIG_GPIO=y

# --- Build -------------------------------------------------------
CONFIG_BUILD_OUTPUT_UF2=y

# --- Lo-ra -------------------------------------------
CONFIG_LORA=y
